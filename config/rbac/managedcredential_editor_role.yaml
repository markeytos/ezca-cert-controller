# This rule is not used by the project ezca-cert-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ezca.keytos.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ezca-cert-controller
    app.kubernetes.io/managed-by: kustomize
  name: managedcredential-editor-role
rules:
- apiGroups:
  - ezca.keytos.io
  resources:
  - managedcredentials
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ezca.keytos.io
  resources:
  - managedcredentials/status
  verbs:
  - get
