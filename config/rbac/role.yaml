---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ezca.keytos.io
  resources:
  - clustercertidentities
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ezca.keytos.io
  resources:
  - clustercertidentities/finalizers
  verbs:
  - update
- apiGroups:
  - ezca.keytos.io
  resources:
  - clustercertidentities/status
  verbs:
  - get
  - patch
  - update
