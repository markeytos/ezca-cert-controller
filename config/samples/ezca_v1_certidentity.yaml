apiVersion: ezca.keytos.io/v1
kind: CertIdentity
metadata:
  labels:
    app.kubernetes.io/name: ezca-cert-controller
    app.kubernetes.io/managed-by: kustomize
  name: certidentity-sample
spec:
  # Friendly identifier for this certificate identity.
  name: sample-cluster-cert-identity
  # EZCA instance used to renew the certificate.
  ezcaURL: https://portal.ezca.io
  # Renew once 20% or less of the certificate lifetime remains.
  renewalThreshold: 20
  # Azure sovereign cloud (Public or USGov).
  cloud: Public
  # kubernetes.io/tls Secret holding the bootstrapped cert (tls.crt) and RSA key
  # (tls.key). certSecretNamespace defaults to the controller's namespace.
  certSecretName: cluster-cert-identity
  # Optional Entra ID app registration to rotate the certificate onto. tenantID,
  # appID, and appObjectID must be set together; omit all three for a
  # certificate-only identity. appObjectID is the app registration's directory
  # object ID (the "Object ID" in the portal), not the Application (client) ID.
  tenantID: 00000000-0000-0000-0000-000000000000
  appID: 11111111-1111-1111-1111-111111111111
  appObjectID: 22222222-2222-2222-2222-222222222222
  # Optional Application Insights connection string for telemetry.
  appInsightsConnString: InstrumentationKey=...;IngestionEndpoint=https://...
  # Optional: keep an Azure Key Vault certificate in sync with this Secret. The
  # controller authenticates to the vault as the app above (appID) using this
  # certificate, so keyVault requires the app fields and that app's service
  # principal must have get + import permission on the vault.
  # keyVault:
  #   vaultName: my-key-vault
  #   certName: cluster-cert-identity
# TODO(user): Add fields here
