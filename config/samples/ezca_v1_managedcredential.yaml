apiVersion: ezca.keytos.io/v1
kind: ManagedCredential
metadata:
  labels:
    app.kubernetes.io/name: ezca-cert-controller
    app.kubernetes.io/managed-by: kustomize
  name: managedcredential-sample
spec:
  # EZCA instance that issues and renews the certificate.
  ezcaURL: https://portal.ezca.io

  # Desired certificate identity.
  subjectName: CN=sub-app.example.com

  # Subject alternative names, grouped by type (all optional).
  dnsNames:
    - sub-app.example.com
    - api.sub-app.example.com
  ipAddresses:
    - 192.0.2.10
    - 2001:db8::1
  uris:
    - spiffe://cluster.local/ns/default/sa/sub-app
  emailAddresses:
    - admin@example.com

  # Requested certificate lifetime in days (optional; defaults to 90).
  validityInDays: 90

  # Key usages and extended key usages (optional; omitted lets EZCA default to
  # Digital Signature + Key Encipherment and Server Auth + Client Auth).
  keyUsages:
    - DigitalSignature
    - KeyEncipherment
  extendedKeyUsages:
    - ServerAuth
    - ClientAuth

  # EZCA CA and template (UUIDs) used to issue the certificate.
  caID: 00000000-0000-0000-0000-000000000000
  templateID: 11111111-1111-1111-1111-111111111111

  # The ClusterCertIdentity whose certificate bootstraps the first issuance.
  # Its certificate authenticates the issuance request to EZCA as that app.
  identityRef:
    name: clustercertidentity-sample
    kind: ClusterCertIdentity

  # Name of the kubernetes.io/tls Secret the controller creates and manages in
  # this ManagedCredential's namespace.
  certSecretName: sub-app-cert

  # Renew once 20% of the certificate lifetime remains.
  renewalThreshold: 20

  # Optional: this credential's own Entra app registration, rotated on renewal.
  # Required if keyVault is set (the certificate authenticates to Key Vault as
  # this app). Omit for a certificate-only credential.
  # tenantID: 22222222-2222-2222-2222-222222222222
  # appID: 33333333-3333-3333-3333-333333333333
  # appObjectID: 44444444-4444-4444-4444-444444444444

  # Optional: keep an Azure Key Vault certificate in sync with the Secret.
  # keyVault:
  #   vaultName: my-vault
  #   certName: sub-app-cert
