## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: keytos-eqgzasb8bufxa0cd.azurecr.io/ezca/cert-controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

## ─────────────────────────────────────────────────────────────────────────────
## Certificate configuration — the CRs this chart renders.
##
## The chart renders one cluster-scoped ClusterCertIdentity (from clusterIdentity)
## and one namespaced ManagedCredential per entry in appCerts.
##
## ROOT-ONLY fields (cloud, ezcaURL, tenantID, appInsightsConnString) are set once
## here and applied to EVERY generated CR — they are not overridable per item.
## The Entra app is per item via appID/appObjectID (each pairs with the root
## tenantID). See README.md for the full field reference and how these values map
## to the CRD field names.
## ─────────────────────────────────────────────────────────────────────────────

## Azure sovereign cloud for Entra ID / Microsoft Graph. One of: Public, USGov.
cloud: Public

## Base URL of the EZCA instance used to renew/issue certificates. Required.
ezcaURL: "https://portal.ezca.io"

## Entra ID (Azure AD) tenant that owns the app registrations. Optional, root-only.
## Only emitted on a CR when that CR also supplies appID + appObjectID.
tenantID: ""

## Optional Azure Application Insights connection string. Root-only. When set,
## renewals/rotations/errors are reported to Application Insights for every CR.
appInsightsConnString: ""

## One cluster-scoped ClusterCertIdentity. Set clusterIdentity.name to "" (or null)
## to skip rendering it (e.g. when appCerts reference an identity created elsewhere).
clusterIdentity:
  ## metadata.name of the ClusterCertIdentity.
  name: master-cert-identity-1
  ## Entra app (client) ID and directory object ID. Set together to enable Entra
  ## app rotation + Key Vault sync; leave both blank for a certificate-only identity.
  appID: ""
  appObjectID: ""
  ## Name of the pre-existing kubernetes.io/tls Secret holding the bootstrap cert.
  ## The chart references this Secret; it does NOT create it (see README.md).
  certSecretName: cluster-cert-identity
  ## Namespace of that Secret. Blank -> the release namespace.
  certSecretNamespace: ""
  ## Percent of lifetime remaining at/below which to renew (1-99). Defaults to 20.
  renewalThreshold: 20
  ## Namespaces whose ManagedCredentials may reference this identity via
  ## identityRef. Required by the CRD (at least one). Blank -> [release namespace].
  allowedNamespaces: []
  ## Optional: keep a certificate in an Azure Key Vault in sync with the Secret.
  ## Requires the Entra app fields above. Omit or leave blank to disable.
  keyVault:
    vaultName: ""
    certName: ""

## Zero or more ManagedCredential CRs. Each entry with a subjectName renders one.
appCerts: []
  # - name: web-frontend-cert            # metadata.name (defaults to app-cert-<n>)
  #   namespace: ""                       # metadata.namespace; blank -> release namespace
  #   subjectName: web.example.com        # required
  #   dnsNames: [web.example.com, www.example.com]
  #   ipAddresses: []
  #   uris: []
  #   emailAddresses: []
  #   keyUsages: [DigitalSignature, KeyEncipherment]
  #   extendedKeyUsages: [ServerAuth]
  #   validityInDays: 90
  #   caID: "00000000-0000-0000-0000-000000000000"        # required (EZCA CA UUID)
  #   templateID: "00000000-0000-0000-0000-000000000000"  # required (EZCA template UUID)
  #   certSecretName: web-frontend-cert   # issued-cert Secret name (defaults per CRD)
  #   renewalThreshold: 20
  #   appID: ""                           # optional per-item Entra app (with tenantID)
  #   appObjectID: ""
  #   keyVault: {vaultName: "", certName: ""}   # optional; requires the app fields
  #   identityRef:                        # identity that bootstraps first issuance
  #     name: master-cert-identity-1
  #     kind: ClusterCertIdentity         # ClusterCertIdentity or CertIdentity

