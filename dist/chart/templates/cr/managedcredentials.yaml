{{- range $i, $cred := .Values.appCerts }}
{{- if and $cred.identityRef (or (not $cred.subjectName) (not $cred.caID) (not $cred.templateID)) }}
{{- fail (printf "appCerts[%d]: subjectName, caID, and templateID are required when identityRef is set; they define what identityRef issues" $i) }}
{{- end }}
{{- $name := $cred.name | default (printf "app-cert-%d" (add $i 1)) }}
{{- /* Default certSecretName to this credential's own name so each
       ManagedCredential gets a unique Secret. Without this, an omitted
       certSecretName falls through to the CRD default (cluster-cert-identity),
       which would collide across credentials and with the bootstrap identity. */}}
{{- $_ := set $cred "certSecretName" ($cred.certSecretName | default $name) }}
---
apiVersion: ezca.keytos.io/v1
kind: ManagedCredential
metadata:
  name: {{ $name }}
  namespace: {{ $cred.namespace | default $.Release.Namespace }}
  labels:
    {{- include "ezca.labels" $ | nindent 4 }}
spec:
  {{- include "ezca.baseSpec" (dict "item" $cred "root" $.Values.global) | nindent 2 }}
  {{- with $cred.subjectName }}
  subjectName: {{ . | quote }}
  {{- end }}
  {{- with $cred.caID }}
  caID: {{ . | quote }}
  {{- end }}
  {{- with $cred.templateID }}
  templateID: {{ . | quote }}
  {{- end }}
  {{- if $cred.validityInDays }}
  validityInDays: {{ $cred.validityInDays }}
  {{- end }}
  {{- with $cred.dnsNames }}
  dnsNames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cred.ipAddresses }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cred.uris }}
  uris:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cred.emailAddresses }}
  emailAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cred.keyUsages }}
  keyUsages:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cred.extendedKeyUsages }}
  extendedKeyUsages:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cred.identityRef }}
  identityRef:
    name: {{ required "appCerts[].identityRef.name is required" .name | quote }}
    kind: {{ required "appCerts[].identityRef.kind is required (ClusterCertIdentity or CertIdentity)" .kind }}
  {{- end }}
{{- end }}
