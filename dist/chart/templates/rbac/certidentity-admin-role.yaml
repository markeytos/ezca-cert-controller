{{- if .Values.controller.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.controller.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.controller.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ezca-cert-controller.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "ezca-cert-controller.resourceName" (dict "suffix" "certidentity-admin-role" "context" $) }}
rules:
- apiGroups:
  - ezca.keytos.io
  resources:
  - certidentities
  verbs:
  - '*'
- apiGroups:
  - ezca.keytos.io
  resources:
  - certidentities/status
  verbs:
  - get
{{- end }}
