apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.controller.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.controller.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "ezca-cert-controller.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ezca.keytos.io
  resources:
  - certidentities
  - clustercertidentities
  - managedcredentials
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ezca.keytos.io
  resources:
  - certidentities/finalizers
  - clustercertidentities/finalizers
  - managedcredentials/finalizers
  verbs:
  - update
- apiGroups:
  - ezca.keytos.io
  resources:
  - certidentities/status
  - clustercertidentities/status
  - managedcredentials/status
  verbs:
  - get
  - patch
  - update
