{{- if .Values.controller.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ezca-cert-controller.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "ezca-cert-controller.resourceName" (dict "suffix" "controller-manager-metrics-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: {{ if .Values.controller.metrics.secure }}https{{ else }}http{{ end }}
    port: {{ .Values.controller.metrics.port }}
    protocol: TCP
    targetPort: {{ .Values.controller.metrics.port }}
  selector:
    app.kubernetes.io/name: {{ include "ezca-cert-controller.name" . }}
    control-plane: controller-manager
{{- end }}
