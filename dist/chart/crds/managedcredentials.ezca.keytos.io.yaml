apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: managedcredentials.ezca.keytos.io
spec:
  group: ezca.keytos.io
  names:
    kind: ManagedCredential
    listKind: ManagedCredentialList
    plural: managedcredentials
    shortNames:
    - mc
    singular: managedcredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Available')].status
      name: Ready
      type: string
    - jsonPath: .status.notAfter
      name: Expiration
      type: string
    - jsonPath: .status.thumbprint
      name: Thumbprint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ManagedCredential is the Schema for the managedcredentials API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ManagedCredential
            properties:
              appID:
                description: |-
                  appID is the Entra ID (Azure AD) application (client) ID whose
                  certificate credentials are rotated. It is used to authenticate as the
                  app and as the proof-of-possession issuer. It must be set together with
                  tenantID and appObjectID.
                minLength: 1
                type: string
              appInsightsConnString:
                description: |-
                  appInsightsConnString is an optional Azure Application Insights
                  connection string. When set, renewals, rotations, and errors are
                  reported to Application Insights.
                minLength: 1
                type: string
              appObjectID:
                description: |-
                  appObjectID is the Entra ID directory object ID of the app registration
                  (the "id" of the application object, not the appId). It is required to
                  call Graph addKey/removeKey directly, avoiding a lookup that needs
                  directory read permissions. It must be set together with tenantID and
                  appID.
                minLength: 1
                type: string
              caID:
                description: |-
                  caID is the EZCA SSL certificate authority (UUID) that issues this
                  credential's certificate when it is bootstrapped or re-issued.
                format: uuid
                minLength: 1
                type: string
              certSecretName:
                default: cluster-cert-identity
                description: |-
                  certSecretName is the name of the kubernetes.io/tls Secret holding the
                  bootstrapped certificate (tls.crt, leaf plus chain) and its RSA private
                  key (tls.key). The controller reads and rewrites this Secret.
                type: string
              cloud:
                default: Public
                description: |-
                  cloud selects the Azure sovereign cloud used to reach Entra ID and
                  Microsoft Graph.
                enum:
                - Public
                - USGov
                type: string
              dnsNames:
                description: dnsNames are the DNS Name (dNSName) subject alternative
                  names.
                items:
                  minLength: 1
                  type: string
                type: array
              emailAddresses:
                description: emailAddresses are the email (rfc822Name) subject alternative
                  names.
                items:
                  minLength: 1
                  type: string
                type: array
              extendedKeyUsages:
                description: |-
                  extendedKeyUsages are the certificate extended key usages. When empty the
                  issuer defaults to Server Authentication and Client Authentication.
                items:
                  description: |-
                    ExtKeyUsage is a certificate extended key usage. The values mirror the
                    extended key usages supported by EZCA (see ezca-go's ExtKeyUsage).
                  enum:
                  - Any
                  - ServerAuth
                  - ClientAuth
                  - CodeSigning
                  - EmailProtection
                  - IPSECEndSystem
                  - IPSECTunnel
                  - IPSECUser
                  - TimeStamping
                  - OCSPSigning
                  - MicrosoftServerGatedCrypto
                  - NetscapeServerGatedCrypto
                  - MicrosoftCommercialCodeSigning
                  - MicrosoftKernelCodeSigning
                  type: string
                type: array
              ezcaURL:
                description: |-
                  ezcaURL is the base URL of the EZCA instance used to renew the
                  certificate (for example https://portal.ezca.io).
                minLength: 1
                type: string
              identityRef:
                description: |-
                  identityRef points to the identity whose certificate bootstraps this
                  credential. It is required on first issuance (when the Secret is empty),
                  where its certificate authenticates the issuance request to EZCA. When it
                  is omitted, the certificate must be provisioned into the Secret externally
                  and the controller only renews and rotates it thereafter.
                properties:
                  kind:
                    description: |-
                      kind is the kind of identity referenced (ClusterCertIdentity or
                      CertIdentity).
                    enum:
                    - ClusterCertIdentity
                    - CertIdentity
                    minLength: 1
                    type: string
                  name:
                    description: name is the name of the identity from which we bootstrap
                      this credential.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              ipAddresses:
                description: ipAddresses are the IP Address (iPAddress) subject alternative
                  names.
                items:
                  minLength: 1
                  type: string
                type: array
              keyUsages:
                description: |-
                  keyUsages are the certificate key usages. When empty the issuer defaults
                  to Digital Signature and Key Encipherment.
                items:
                  description: |-
                    KeyUsage is a certificate key usage. The values mirror the key usages
                    supported by EZCA (see ezca-go's KeyUsage).
                  enum:
                  - DigitalSignature
                  - KeyEncipherment
                  - DataEncipherment
                  - KeyAgreement
                  - NonRepudiation
                  type: string
                type: array
              keyVault:
                description: |-
                  keyVault, when set, keeps a certificate in an Azure Key Vault in sync with
                  the Secret. On every reconcile the controller ensures the named vault
                  certificate matches the Secret, importing the current certificate (and
                  key) whenever they differ. The controller authenticates to the vault as
                  the identity's app using its certificate, so this requires the app fields
                  (tenantID, appID, appObjectID) and the app service principal must have get
                  and import permission on the vault.
                properties:
                  certName:
                    description: certName is the name of the certificate in the vault
                      to keep in sync.
                    minLength: 1
                    type: string
                  vaultName:
                    description: vaultName is the name of the Azure Key Vault (not
                      the full URL).
                    minLength: 1
                    type: string
                required:
                - certName
                - vaultName
                type: object
              renewalThreshold:
                default: 20
                description: |-
                  renewalThreshold is the percentage of the certificate's total lifetime
                  remaining at or below which the certificate is renewed.
                format: int32
                maximum: 99
                minimum: 1
                type: integer
              subjectName:
                description: |-
                  subjectName is the certificate subject. It may be a full RFC 4514
                  distinguished name (for example "CN=app,OU=team,O=corp") or a bare common
                  name (for example "app.example.com"), in which case it is treated as the
                  CN.
                minLength: 1
                type: string
              templateID:
                description: |-
                  templateID is the EZCA template (UUID) used when issuing this credential's
                  certificate.
                format: uuid
                minLength: 1
                type: string
              tenantID:
                description: |-
                  tenantID is the Entra ID (Azure AD) tenant that owns the app
                  registration. It must be set together with appID.
                minLength: 1
                type: string
              uris:
                description: uris are the URI (uniformResourceIdentifier) subject
                  alternative names.
                items:
                  minLength: 1
                  type: string
                type: array
              validityInDays:
                description: |-
                  validityInDays is the requested certificate lifetime in days. When unset
                  the issuing authority's default (90 days) is used.
                format: int32
                minimum: 1
                type: integer
            required:
            - caID
            - certSecretName
            - ezcaURL
            - renewalThreshold
            - subjectName
            - templateID
            type: object
            x-kubernetes-validations:
            - message: tenantID, appID, and appObjectID must be set together
              rule: has(self.tenantID) == has(self.appID) && has(self.appID) == has(self.appObjectID)
            - message: keyVault requires the Entra app fields (tenantID, appID, appObjectID);
                the certificate authenticates to Key Vault as that app
              rule: '!has(self.keyVault) || has(self.appID)'
          status:
            description: status defines the observed state of ManagedCredential
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the ClusterCertIdentity resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRenewalTime:
                description: lastRenewalTime is when the controller last renewed the
                  certificate.
                format: date-time
                type: string
              managedKeyCredentials:
                description: |-
                  managedKeyCredentials are the certificates the controller has added to
                  the Entra ID app registration, tracked so expired ones can be removed.
                items:
                  description: |-
                    ManagedKeyCredential records a certificate the controller added to an Entra ID
                    app registration so it can be removed once it expires.
                  properties:
                    keyID:
                      description: keyID is the keyCredential identifier assigned
                        by Microsoft Graph.
                      type: string
                    notAfter:
                      description: |-
                        notAfter is the managed certificate's expiry. The credential is removed
                        from the app registration only after this time.
                      format: date-time
                      type: string
                    thumbprint:
                      description: thumbprint is the SHA-1 thumbprint (hex) of the
                        managed certificate.
                      type: string
                  required:
                  - keyID
                  - notAfter
                  - thumbprint
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - thumbprint
                x-kubernetes-list-type: map
              notAfter:
                description: notAfter is the end of the current certificate's validity
                  window.
                format: date-time
                type: string
              notBefore:
                description: notBefore is the start of the current certificate's validity
                  window.
                format: date-time
                type: string
              pendingSince:
                description: |-
                  pendingSince is when the pending certificate was added, used to bound how
                  long the controller waits for Entra ID propagation.
                format: date-time
                type: string
              pendingThumbprint:
                description: |-
                  pendingThumbprint is the SHA-1 thumbprint (hex) of a renewed certificate
                  that has been added to the app registration and is awaiting propagation
                  in Entra ID before it is promoted into the Secret.
                type: string
              thumbprint:
                description: thumbprint is the SHA-1 thumbprint (hex) of the current
                  certificate.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
