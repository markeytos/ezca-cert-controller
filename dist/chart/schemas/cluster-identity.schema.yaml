## Schema for `clusterIdentity:` in values.yaml — the one cluster-scoped
## ClusterCertIdentity this chart renders. Bundled into values.schema.json by
## `make helm-schema`.
##
## Keep in step with dist/chart/templates/cr/clustercertidentity.yaml and the
## ClusterCertIdentity CRD.
$schema: https://json-schema.org/draft/2020-12/schema
title: clusterIdentity
description: The bootstrap identity other credentials authenticate as. Rendered only when name is set.
type: object
additionalProperties: false

properties:
  name:
    description: metadata.name of the ClusterCertIdentity. Blank means none is created.
    type: string
    maxLength: 253
    pattern: ^$|^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$

  appID:
    description: Entra app (client) ID whose certificate credentials are rotated. Set with appObjectID and global.tenantID, or leave all blank for a certificate-only identity.
    type: string
  appObjectID:
    description: Entra directory object ID of that app registration (the object's id, not the appId).
    type: string

  certSecretName:
    description: Pre-existing kubernetes.io/tls Secret holding the bootstrap certificate. The chart references it and never creates it.
    type: string
    maxLength: 253
    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
  certSecretNamespace:
    description: Namespace of that Secret. Blank means the release namespace.
    type: string
    maxLength: 63
    pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$

  renewalThreshold:
    description: Percent of lifetime remaining at/below which to renew.
    type: integer
    minimum: 1
    maximum: 99

  allowedNamespaces:
    description: Namespaces whose ManagedCredentials may reference this identity via identityRef. Blank means the release namespace alone.
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1

  secretReplicas:
    description: Read-only copies of the certificate Secret, kept in sync by the controller for workloads in other namespaces that share this certificate. Each copy holds the private key. A copy removed from the list is deleted.
    type: array
    maxItems: 50
    items:
      type: object
      additionalProperties: false
      required: [namespace, name]
      properties:
        namespace:
          description: Namespace of the copy.
          type: string
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        name:
          description: Name of the copy.
          type: string
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$

  keyVaults:
    description: Optional Key Vault certificates to keep in sync with the Secret, each synced independently. Needs the Entra app fields, which the chart checks while rendering; the app needs get and import permission on every vault.
    type: array
    maxItems: 20
    items:
      type: object
      additionalProperties: false
      required: [vaultName, certName]
      properties:
        vaultName:
          description: Vault name, not the full URL.
          type: string
          minLength: 1
          maxLength: 24
        certName:
          description: Certificate name in that vault.
          type: string
          minLength: 1
          maxLength: 127

dependentRequired:
  appID: [appObjectID]
  appObjectID: [appID]
