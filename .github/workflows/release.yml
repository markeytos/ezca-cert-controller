name: Release

# Publishes the controller image and the Helm chart (as an OCI artifact) to the
# public Azure Container Registry. Run manually from the Actions tab (or `gh workflow
# run Release -f version=X.Y.Z`), supplying the version to publish.
#
# Required repository secrets:
#   ACR_USERNAME  - service-principal appId (client ID) with AcrPush on the registry
#   ACR_PASSWORD  - the service principal's password/secret
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE - for signing the chart provenance

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (semver, no leading v, e.g. 0.1.0)'
        required: true
        type: string

permissions: {}

env:
  REGISTRY: keytos-eqgzasb8bufxa0cd.azurecr.io
  IMAGE_REPO: keytos-eqgzasb8bufxa0cd.azurecr.io/ezca/cert-controller
  CHART_OCI_REPO: oci://keytos-eqgzasb8bufxa0cd.azurecr.io/ezca/helm

jobs:
  release:
    name: Build & publish image + chart
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Normalize version
        id: ver
        run: echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.ver.outputs.version }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Log in to ACR for Helm (OCI)
        # Pass the password via stdin, not argv, so it never lands in the process
        # arg list (and helm's insecure-CLI-password warning is avoided).
        run: printf '%s' "$ACR_PASSWORD" | helm registry login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Import PGP signing key
        run: |
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Helm's provenance verifier reads a legacy keyring, not the modern
          # pubring.kbx, so export the secret key into a legacy keyring file.
          # loopback + passphrase are required for GnuPG to release a
          # passphrase-protected key non-interactively.
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --export-secret-keys > "$RUNNER_TEMP/secring.gpg"
          # Helm matches --key against the key's UID (name/email), not the
          # fingerprint, so derive the primary UID from the imported key.
          uid="$(gpg --list-secret-keys --with-colons | awk -F: '/^uid:/{print $10; exit}')"
          echo "GPG_SIGN_UID=$uid" >> "$GITHUB_ENV"
          # Export the ASCII-armored public key so it can be attached to the
          # GitHub release, letting users verify a single release's .prov.
          gpg --armor --export "$uid" > "$RUNNER_TEMP/keytos-helm-pubkey.asc"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Package chart (signed)
        run: |
          helm package dist/chart \
            --version "$V" --app-version "$V" \
            --destination dist/ \
            --sign --key "$GPG_SIGN_UID" \
            --keyring "$RUNNER_TEMP/secring.gpg" \
            --passphrase-file "$RUNNER_TEMP/passphrase"
        env:
          V: ${{ steps.ver.outputs.version }}

      - name: Push chart + provenance to ACR (OCI)
        # helm push uploads the sibling .tgz.prov automatically when it exists.
        run: helm push "dist/ezca-cert-controller-${{ steps.ver.outputs.version }}.tgz" "$CHART_OCI_REPO"

      - name: Create GitHub release
        # Attach the packaged chart, its provenance signature, and the public
        # signing key so a single release can be verified end-to-end:
        #   gpg --dearmor < keytos-helm-pubkey.asc > pubring.gpg
        #   helm verify --keyring pubring.gpg ezca-cert-controller-<V>.tgz
        run: |
          # --target pins the tag to the ref this run built (the workflow can be
          # dispatched from a non-default branch); without it the tag would be cut
          # from the default branch and diverge from the published image/chart.
          # If the release already exists (a re-run after the image/chart were
          # already pushed), fall back to uploading/replacing the assets so the
          # run is idempotent instead of failing after publishing.
          gh release create "v$V" \
            "dist/ezca-cert-controller-$V.tgz" \
            "dist/ezca-cert-controller-$V.tgz.prov" \
            "$RUNNER_TEMP/keytos-helm-pubkey.asc" \
            --target "$GITHUB_SHA" \
            --title "v$V" \
            --notes "ezca-cert-controller chart and controller image \`$V\`.

          The chart is published to the ACR OCI registry; the assets here let you
          verify this release independently. \`keytos-helm-pubkey.asc\` is the PGP
          public signing key — import it once, then verify the attached \`.tgz\`
          against its \`.prov\`:

          \`\`\`
          gpg --dearmor < keytos-helm-pubkey.asc > pubring.gpg
          helm verify --keyring pubring.gpg ezca-cert-controller-$V.tgz
          \`\`\`" \
          || gh release upload "v$V" \
            "dist/ezca-cert-controller-$V.tgz" \
            "dist/ezca-cert-controller-$V.tgz.prov" \
            "$RUNNER_TEMP/keytos-helm-pubkey.asc" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/secring.gpg" "$RUNNER_TEMP/passphrase"

      - name: Log out of ACR for Helm
        if: always()
        run: helm registry logout "$REGISTRY" || true
